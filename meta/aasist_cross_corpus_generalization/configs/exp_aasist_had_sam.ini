# AASIST with SAM (Sharpness-Aware Minimization) on the exact same
# 2500/class HAD-held-out fold as exp_aasist_had_baseline.ini (bare
# AASIST: 7.95% test EER, ~4% best DEV EER).
#
# freeze_ssl_frontend was tried first here and REJECTED: the companion
# exp_aasist_had_frozen_last.ini run (freeze_ssl_frontend=True,
# ssl_layer_pooling=last, no SAM) plateaued at 26.8% DEV EER after 8
# epochs and was still improving slowly -- roughly 6-7x worse than
# bare's ~4% DEV EER on this same fold, not the "3-5x faster, comparable
# accuracy" Pascu et al. (Interspeech 2024) report for their own (much
# smaller) classifier head. AASIST's large graph-attention backend
# apparently can't recover spoofing-discriminative signal from a frozen,
# generic-speech SSL representation the way a tiny linear probe can --
# freezing is a real negative finding for THIS architecture, not
# something to carry into the SAM run. Left unfrozen here so this run is
# comparable to the 7.95% bare baseline, not to the broken frozen one.
#
# Motivation: Huang et al. (Interspeech 2025, arXiv:2506.11532) and Shim
# et al. (2023) report SAM substantially closes AASIST's cross-domain
# generalization gap when trained on 19LA only; testing whether the same
# holds for a HAD-held-out, multi-database training pool.

[EXP]
root = results_aasist_had_sam
name = aasist_had_sam
epochs = 50
save = True
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto
sam = True
sam_rho = 0.05

[AASIST]
batch_size = 16
rawboost_algo = 0
ssl_layer_pooling = last
freeze_ssl_frontend = False

[PLOT]
best_model = True
