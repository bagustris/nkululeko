# ADM with SAM (Sharpness-Aware Minimization), on the exact same 2500/class
# HAD-held-out fold as exp_adm_had_baseline.ini (ADM baseline: 36.95%
# test EER). Only MODEL.sam/sam_rho added -- second cross-model SAM
# datapoint alongside exp_aasist_had_sam.ini, using the same
# nkululeko/optimizers/sam.py wrapper and the same MODEL.sam key.
#
# AASIST's own SAM result on this fold: best DEV EER 3.1% (beats bare's
# ~4%) but TEST EER 15.50% -- WORSE than bare's 7.95%, a real dev/test
# generalization gap. Worth checking whether ADM shows the same
# divergence or not -- if it doesn't, that's evidence the gap is an
# AASIST/pooled-multi-domain-training interaction, not a problem with
# the SAM implementation itself.

[EXP]
root = results_adm_had_sam
name = adm_had_sam
epochs = 50
save = False
traindevtest = True

[FEATS]
type = ['wav2vec2', 'sptk']
scale = standard
wav2vec2.model = facebook/wav2vec2-base
wav2vec2.layer = 7
sptk.features = ['fbank', 'stft']
sptk.fft_length = 512
sptk.frame_period = 160
sptk.frame_length = 400
sptk.n_channel = 80

[MODEL]
n_jobs = 12
type = adm
measure = eer
adm.ssl_feat_dim = 768
adm.phase_feat_dim = 257
adm.fusion = weighted
adm.hidden_dim = 256
patience = 5
learning_rate = 0.0001
optimizer = adam
batch_size = 32
loss = weighted_bce
class_weight = auto
sam = True
sam_rho = 0.05

[PLOT]
best_model = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
la = ./data/multidb_ood/_aasist_subsample_2500/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
cvoicefake = ./data/multidb_ood/_aasist_subsample_2500/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
habla = ./data/multidb_ood/_aasist_subsample_2500/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
for2sec = ./data/multidb_ood/_aasist_subsample_2500/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
had = ./data/multidb_ood/_aasist_subsample_2500/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
itw.split_strategy = train
la.split_strategy = train
cvoicefake.split_strategy = train
habla.split_strategy = train
for2sec.split_strategy = dev
had.split_strategy = test
databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = False
