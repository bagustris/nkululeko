# AASIST + RawBoost augmentation, on the exact same 2500/class subsampled
# HAD-held-out fold as exp_aasist_had_baseline.ini (7.95% test EER) --
# only difference is AASIST.rawboost_algo, so any change in outcome
# isolates RawBoost's effect.
#
# algo=5 (LnL convolutive noise + ISD additive noise, in series) is the
# setting most commonly used as the ASVspoof2021 LA-track RawBoost
# baseline in the literature this AASIST port is based on -- a reasonable
# default for a first comparison rather than a full sweep of all 8
# algorithms.
#
# RawBoost is applied to the *train* split only (see _WaveformDataset's
# `augment` flag in nkululeko/models/model_aasist.py) -- dev/test stay
# clean, matching standard augmentation practice.
#
# Note: RawBoost's numpy/scipy augmentation runs in the main process
# (DataLoader num_workers=0), so this is CPU-bound between GPU batches --
# roughly 1.5-2x slower per epoch than the bare baseline.

[EXP]
root = results_aasist_had_rawboost
name = aasist_had_rawboost
epochs = 50
save = True
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 4
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto

[AASIST]
batch_size = 16
rawboost_algo = 5

[PLOT]
best_model = True
