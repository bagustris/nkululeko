# AASIST + domain-balanced batch sampling, on the exact same 2500/class
# subsampled HAD-held-out fold as exp_aasist_had_baseline.ini (7.95% test
# EER) -- only difference is MODEL.domain_balanced_sampling, so any
# change in outcome isolates this technique's effect.
#
# Caveat worth keeping in mind when reading the result: this particular
# subsample was built as an EQUAL 2500/class stratified sample per
# training database (itw/la/cvoicefake/habla all exactly 5000 rows), so
# the technique's main motivating scenario -- a large pooled dataset
# (e.g. the full pool's LA19 at ~121k rows vs itw's ~32k) dominating
# batch gradients by sheer count -- isn't actually present here. Any
# effect measured on this fold is purely from per-batch composition
# variance (plain shuffling can still give some batches skewed domain
# mixes even with equal total counts), not the size-imbalance problem
# this technique is really aimed at.

[EXP]
root = results_aasist_had_domain_balanced
name = aasist_had_domain_balanced
epochs = 50
save = True
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 4
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto
domain_balanced_sampling = True

[AASIST]
batch_size = 16
rawboost_algo = 0

[PLOT]
best_model = True
