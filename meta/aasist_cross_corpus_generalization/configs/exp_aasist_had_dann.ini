# AASIST with single-axis domain-adversarial training (DANN), on the
# exact same 2500/class HAD-held-out fold as exp_aasist_had_baseline.ini
# (bare AASIST: 7.95% test EER, ~4% best DEV EER). Unfrozen frontend --
# freezing was tried and rejected earlier this session (see
# exp_aasist_had_frozen_last.ini's comment), so every later comparison
# run stays unfrozen to remain comparable to the bare baseline.
#
# dann_columns = ['source_db'] attaches one DomainAdversarialHead to the
# backend's pooled feature vector, trained (via gradient reversal) to
# push the shared representation toward features that can't predict
# which of the four pooled training databases (itw/la/cvoicefake/habla)
# a sample came from -- cross-dataset invariance, the axis this
# project's held-out-domain generalization problem is literally about.
# Single-axis only: the language axis (CVoiceFake/DECRO's language
# column) needs a language-labeled fold that doesn't exist yet, so the
# originally-planned two-axis version isn't reachable without first
# building that fold.
#
# Given this session's other three techniques on AASIST (RawBoost,
# domain-balanced sampling, SAM) all show the same "collapse toward
# predicting real" signature in their negative results, worth checking
# whether DANN reproduces it too or is a genuinely different failure
# mode / a genuine win.

[EXP]
root = results_aasist_had_dann
name = aasist_had_dann
epochs = 50
save = True
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto
dann_columns = ['source_db']
dann_lambda = 1.0
dann_weight = 1.0
dann_reverse = True

[AASIST]
batch_size = 16
rawboost_algo = 0
ssl_layer_pooling = last
freeze_ssl_frontend = False

[PLOT]
best_model = True
