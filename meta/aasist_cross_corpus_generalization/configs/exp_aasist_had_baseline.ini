# Bare AASIST (no generalization techniques) on a stratified 2500/class
# subsample of the HAD-held-out LODO fold -- the working baseline this
# session settled on after a 300/class sanity check (11.00% test EER,
# 72min) confirmed the architecture trains correctly, and the full pool
# (~200k+ rows) turned out to make even one epoch take hours.
#
# 2500/class per training database (itw+la+cvoicefake+habla -> 20,000
# pooled train rows), 1000/class for dev (for2sec) and test (had) --
# data/multidb_ood/_aasist_subsample_2500/*.csv, a stratified sample
# (seed=42) of the real full CSVs, built once via a one-off pandas
# groupby/sample script (not checked in; regenerate by sampling
# 2500/class from itw/la/cvoicefake/habla and 1000/class from for2sec/had).
#
# Compared against ADM re-run on this exact same subsample+split
# (exp_adm_had_subsample_2500.ini) for an apples-to-apples number on
# training-set size, not just architecture: ADM 36.95% vs AASIST 7.95%.
# This is the baseline RawBoost/domain-balanced-sampling/DANN are
# compared against -- NOT the full-pool ADM number (42.55% mean, 3 runs).

[EXP]
root = results_aasist_had_baseline
name = aasist_had_baseline
epochs = 50
save = True
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 4
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto

[AASIST]
batch_size = 16
rawboost_algo = 0

[PLOT]
best_model = True
