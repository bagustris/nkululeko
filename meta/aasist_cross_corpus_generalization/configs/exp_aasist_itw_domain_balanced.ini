# AASIST + domain-balanced batch sampling, on the exact same 2500/class
# ITW-held-out fold as exp_aasist_itw_baseline.ini (22.85% test EER) --
# only difference is AASIST.domain_balanced_sampling, so any change in
# outcome isolates this technique's effect. Second-fold replication of
# the HAD-fold result (7.95% -> 15.40% EER, worse) -- checks whether
# domain-balanced sampling's failure on HAD was fold-specific or general.
# Same balanced-pool caveat as the HAD-fold run applies here too: la/
# cvoicefake/habla/had are all exactly 2500/class, so this isn't testing
# the technique's real size-imbalance motivating scenario.

[EXP]
root = results_aasist_itw_domain_balanced
name = aasist_itw_domain_balanced
epochs = 50
save = True
traindevtest = True

[DATA]
la = ./data/multidb_ood/_aasist_subsample_2500_itwheld/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500_itwheld/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500_itwheld/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

had = ./data/multidb_ood/_aasist_subsample_2500_itwheld/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500_itwheld/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

itw = ./data/multidb_ood/_aasist_subsample_2500_itwheld/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = test

databases = ['la', 'cvoicefake', 'habla', 'had', 'for2sec', 'itw']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto

[AASIST]
batch_size = 16
rawboost_algo = 0
domain_balanced_sampling = True

[PLOT]
best_model = True
