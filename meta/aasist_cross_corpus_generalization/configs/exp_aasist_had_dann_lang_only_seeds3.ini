# AASIST with single-axis domain-adversarial training on the LANGUAGE
# column only (dann_columns = ['language']), on the same
# _aasist_subsample_2500_lang/ HAD-held-out fold as
# exp_aasist_had_dann.ini (source_db-only, 11.80% test EER single run)
# and exp_aasist_had_dann_2axis.ini (source_db+language, 31.35% test EER
# single run). Isolates whether the 2-axis run's much worse number comes
# from the language axis specifically, or just from having two
# adversarial heads instead of one -- the missing ablation cell.
#
# Run at 3 seeds from the start: the seeded AASIST-had baseline reruns
# showed bare AASIST training on this fold has very high run-to-run
# variance (std ~5pp on EER), so a single run here would be as
# unreliable as the original bare/DANN/SAM single-run numbers turned
# out to be.

[EXP]
root = results_aasist_had_dann_lang_only_seeds3
name = aasist_had_dann_lang_only_seeds3
epochs = 50
runs = 3
save = False
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500_lang/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500_lang/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500_lang/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500_lang/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500_lang/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500_lang/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto
dann_columns = ['language']
dann_lambda = 1.0
dann_weight = 1.0
dann_reverse = True

[AASIST]
batch_size = 16
rawboost_algo = 0
ssl_layer_pooling = last
freeze_ssl_frontend = False

[PLOT]
best_model = True
