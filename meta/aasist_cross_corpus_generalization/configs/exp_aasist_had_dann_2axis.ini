# AASIST with two-axis domain-adversarial training (DANN): dataset-identity
# (source_db) + language-identity, on the same 2500/class HAD-held-out fold
# as exp_aasist_had_dann.ini (single-axis source_db result: 11.80% test EER,
# vs bare's 7.95%; also confirmed to reproduce the "sensitivity(real)=100%,
# specificity(fake) low" pattern -- see exp_aasist_had_dann.ini's history).
#
# Uses _aasist_subsample_2500_lang/ instead of _aasist_subsample_2500/: same
# rows, but itw/la stamped language=en, habla stamped language=es, and
# cvoicefake keeps its own per-row language column (it/de/zh-CN/fr/en).
# Pool-wide language distribution: en=10,931 (54.7%), es=5,000 (25%),
# de=1,514, zh-CN=979, it=814, fr=762 -- NOT a 1:1 recoding of source_db
# (which has 4 values), since cvoicefake alone spans all 5 non-es languages.
# dev/test (for2sec/had) are unchanged -- DANN only needs domain labels on
# the train split.
#
# Unfrozen frontend, same as every other comparison run this project
# (freezing was tried and rejected early in the AASIST work).

[EXP]
root = results_aasist_had_dann_2axis
name = aasist_had_dann_2axis
epochs = 50
save = True
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500_lang/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500_lang/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500_lang/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500_lang/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500_lang/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500_lang/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto
dann_columns = ['source_db', 'language']
dann_lambda = 1.0
dann_weight = 1.0
dann_reverse = True

[AASIST]
batch_size = 16
rawboost_algo = 0
ssl_layer_pooling = last
freeze_ssl_frontend = False

[PLOT]
best_model = True
