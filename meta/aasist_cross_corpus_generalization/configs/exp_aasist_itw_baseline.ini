# Bare AASIST (no generalization techniques) on the ITW-held-out LODO
# fold -- a new fold, not yet run with AASIST, needed as the baseline for
# exp_aasist_itw_rawboost.ini's comparison. Same stratified-subsample
# approach as the HAD fold (exp_aasist_had_baseline.ini): 2500/class for
# the new training pool (la+cvoicefake+habla+had -> 20,000 pooled train
# rows), 1000/class for dev (for2sec) and test (itw) --
# data/multidb_ood/_aasist_subsample_2500_itwheld/*.csv (seed=42).
#
# Why this fold: the RawBoost post-mortem (session investigation, see
# CHANGELOG/commit history around aasist_rawboost.py's fidelity fix)
# found RawBoost's published gains are on channel/codec generalization
# (matching ITW's real-world recording pipeline), while HAD/PartialSpoof
# detection instead relies on splice-boundary artifacts RawBoost's
# convolutive noise directly disrupts (Negroni et al. 2024). ITW is the
# fold RawBoost's own literature predicts it should actually help on.
#
# n_jobs=8 uses the num_workers fix (model_aasist.py's get_loader) that
# makes RawBoost's per-sample CPU-bound augmentation no longer serialize
# against GPU compute -- the HAD-fold RawBoost run took ~8h at n_jobs=0;
# this should be closer to the ~2.5h bare-AASIST baseline took.

[EXP]
root = results_aasist_itw_baseline
name = aasist_itw_baseline
epochs = 50
save = True
traindevtest = True

[DATA]
la = ./data/multidb_ood/_aasist_subsample_2500_itwheld/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500_itwheld/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500_itwheld/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

had = ./data/multidb_ood/_aasist_subsample_2500_itwheld/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500_itwheld/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

itw = ./data/multidb_ood/_aasist_subsample_2500_itwheld/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = test

databases = ['la', 'cvoicefake', 'habla', 'had', 'for2sec', 'itw']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto

[AASIST]
batch_size = 16
rawboost_algo = 0

[PLOT]
best_model = True
