# ADM with a stronger frozen SSL frontend (wav2vec2-xls-r-300m, 1024-dim,
# same checkpoint AASIST's end-to-end frontend uses) instead of the
# wav2vec2-base (768-dim) used in exp_adm_had_baseline.ini (36.95% test EER).
#
# Purpose: separate the two competing explanations for the model-dependence
# pattern seen across SAM/domain-balanced-sampling results this project --
# "frozen features generalize worse than end-to-end fine-tuning" vs. "ADM/MLP
# are just weak models regardless of feature freezing." Every frozen model
# tested so far (ADM, MLP) used wav2vec2-base and landed weak (~37-39% EER);
# every strong model tested (AASIST, 7.95% EER) is end-to-end. This config
# is the first frozen-AND-strong-frontend candidate: if EER lands close to
# AASIST's bare 7.95%, frozen features can be strong and the frozen-vs-e2e
# axis becomes separable from the weak-vs-strong-model axis. If it stays
# weak like wav2vec2-base did, that's evidence ADM's architecture itself
# (not its frontend) is the bottleneck.
#
# GATE: run this baseline first. Only run SAM/domain-balanced-sampling
# variants on top of it if EER meaningfully beats 36.95% -- otherwise the
# frozen-vs-end-to-end question stays unresolved and re-running SAM/DBS
# on a still-weak model adds nothing new.

[EXP]
root = results_adm_had_xlsr
name = adm_had_xlsr
epochs = 50
save = False
traindevtest = True

[FEATS]
type = ['wav2vec2', 'sptk']
scale = standard
wav2vec2.model = facebook/wav2vec2-xls-r-300m
wav2vec2.layer = 7
sptk.features = ['fbank', 'stft']
sptk.fft_length = 512
sptk.frame_period = 160
sptk.frame_length = 400
sptk.n_channel = 80

[MODEL]
n_jobs = 12
type = adm
measure = eer
adm.ssl_feat_dim = 1024
adm.phase_feat_dim = 257
adm.fusion = weighted
adm.hidden_dim = 256
patience = 5
learning_rate = 0.0001
optimizer = adam
batch_size = 32
loss = weighted_bce
class_weight = auto

[PLOT]
best_model = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
la = ./data/multidb_ood/_aasist_subsample_2500/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
cvoicefake = ./data/multidb_ood/_aasist_subsample_2500/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
habla = ./data/multidb_ood/_aasist_subsample_2500/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
for2sec = ./data/multidb_ood/_aasist_subsample_2500/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
had = ./data/multidb_ood/_aasist_subsample_2500/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
itw.split_strategy = train
la.split_strategy = train
cvoicefake.split_strategy = train
habla.split_strategy = train
for2sec.split_strategy = dev
had.split_strategy = test
databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True
