# AASIST + RawBoost augmentation, on the exact same ITW-held-out
# subsampled fold as exp_aasist_itw_baseline.ini -- only difference is
# AASIST.rawboost_algo, so any change in outcome isolates RawBoost's
# effect. See exp_aasist_itw_baseline.ini's header for why ITW (not HAD)
# is the fold RawBoost's own literature predicts it should help on:
# RawBoost targets channel/codec generalization, and ITW is real-world
# recorded/uploaded speech -- the closest match to what RawBoost's
# published ASVspoof2021 gains were measured against, unlike HAD/
# PartialSpoof's splice-boundary-artifact detection, which RawBoost's
# convolutive noise directly disrupted on the earlier HAD-fold run
# (7.95% -> 22.34% EER).
#
# algo=5 (LnL convolutive + ISD additive, in series) -- same choice as
# the HAD-fold run, for a like-for-like comparison of the SAME algorithm
# across folds, not a different algorithm confounding the fold effect.

[EXP]
root = results_aasist_itw_rawboost
name = aasist_itw_rawboost
epochs = 50
save = True
traindevtest = True

[DATA]
la = ./data/multidb_ood/_aasist_subsample_2500_itwheld/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = /home/bagus/data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500_itwheld/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = /home/bagus/data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500_itwheld/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = /home/bagus/data
habla.split_strategy = train

had = ./data/multidb_ood/_aasist_subsample_2500_itwheld/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = /home/bagus/data
had.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500_itwheld/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = /home/bagus/data/for-2sec
for2sec.split_strategy = dev

itw = ./data/multidb_ood/_aasist_subsample_2500_itwheld/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = test

databases = ['la', 'cvoicefake', 'habla', 'had', 'for2sec', 'itw']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
class_weight = auto

[AASIST]
batch_size = 16
rawboost_algo = 5

[PLOT]
best_model = True
